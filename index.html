<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JSON Diff Checker</title>
  <script src="xlsx.full.min.js"></script>
  <style>
</header>
<div class="container">
  <div class="upload-grid">
    <div class="upload-card">
      <label>📊 Excel File (JSON Mappings)</label>
      <div class="file-input-wrapper">
        <button class="btn-upload" onclick="document.getElementById('excelInput').click()">Choose File</button>
        <input type="file" id="excelInput" accept=".xlsx,.xls,.csv" onchange="handleExcel(this)"/>
        <span class="file-name" id="excelFileName">No file selected</span>
      </div>
      <div class="sheet-selector" id="sheetSelector" style="display:none;">
        <label>Select Sheet:</label>
        <select id="sheetSelect" onchange="loadSheet()"></select>
      </div>
      <div class="col-mapping" id="colMapping">
        <label>Map Columns:</label>
        <div class="col-mapping-row">
          <span>Key Path</span>
          <select id="colKey" onchange="buildExcelData();checkReady()"><option value="">— select —</option></select>
        </div>
        <div class="col-mapping-row">
          <span>Value</span>
          <select id="colValue" onchange="buildExcelData();checkReady()"><option value="">— (optional) —</option></select>
        </div>
      </div>
    </div>
    <div class="upload-card">
      <label>📄 JSON File</label>
      <div class="file-input-wrapper">
        <button class="btn-upload" onclick="document.getElementById('jsonInput').click()">Choose File</button>
        <input type="file" id="jsonInput" accept=".json" onchange="handleJson(this)"/>
        <span class="file-name" id="jsonFileName">No file selected</span>
      </div>
    </div>
  </div>
  <div class="options-bar">
    <span style="font-size:13px;font-weight:600;color:#e2e8f0;">Options:</span>
    <label class="option-item"><input type="checkbox" id="optCaseSensitive" checked/> Case-sensitive keys</label>
    <label class="option-item"><input type="checkbox" id="optCompareValues" checked/> Compare values</label>
    <label class="option-item"><input type="checkbox" id="optShowMatches"/> Show matching keys</label>
    <label class="option-item"><input type="checkbox" id="optFlattenDot" checked/> Flatten with dot notation</label>
  </div>
  <div class="error-msg" id="errorMsg" style="display:none;"></div>
  <button class="btn-compare" id="compareBtn" onclick="runComparison()" disabled>🔍 Compare</button>
  <div id="resultsSection" style="display:none;">
    <div class="summary-bar" id="summaryBar"></div>
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn" onclick="setFilter('missing',this)">Missing in JSON</button>
      <button class="filter-btn" onclick="setFilter('extra',this)">Extra in JSON</button>
      <button class="filter-btn" onclick="setFilter('mismatch',this)">Value Mismatch</button>
      <button class="filter-btn" onclick="setFilter('match',this)">Matching</button>
      <button class="btn-export" onclick="exportCSV()">⬇ Export CSV</button>
      <input class="search-box" type="text" id="searchBox" placeholder="🔍 Search key path..." oninput="applyFilters()"/>
    </div>
    <div class="results-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Key Path</th><th>Status</th><th>Excel Value</th><th>JSON Value</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none;">
        <div class="icon">✅</div><p>No results match the current filter.</p>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>
<script>
  function renderTable(){
    const tbody=document.getElementById('resultsBody');
    const emptyState=document.getElementById('emptyState');
    const start=(currentPage-1)*PAGE_SIZE;
    const page=filteredResults.slice(start,start+PAGE_SIZE);
    if(!filteredResults.length){tbody.innerHTML='';emptyState.style.display='block';document.getElementById('pagination').innerHTML='';return;}
    emptyState.style.display='none';
    tbody.innerHTML=page.map((r,i)=>{
      const rowNum=start+i+1;
      const pillLabel={missing:'Missing',extra:'Extra',mismatch:'Mismatch',match:'Match'}[r.status];
      let excelCell='—',jsonCell='—';
      if(r.status==='missing'){excelCell=`<span class="val-present">${esc(r.excelVal)}</span>`;jsonCell=`<span class="val-missing">not found</span>`;}
      else if(r.status==='extra'){excelCell=`<span class="val-missing">not in Excel</span>`;jsonCell=`<span class="val-present">${esc(r.jsonVal)}</span>`;}
      else if(r.status==='mismatch'){excelCell=`<span class="val-mismatch-a">${esc(r.excelVal)}</span>`;jsonCell=`<span class="val-mismatch-b">${esc(r.jsonVal)}</span>`;}
      else{excelCell=`<span class="val-match">${esc(r.excelVal)}</span>`;jsonCell=`<span class="val-match">${esc(r.jsonVal)}</span>`;}
      return `<tr><td style="color:#475569;font-size:11px;">${rowNum}</td><td><span class="key-path">${esc(r.key)}</span></td><td><span class="pill pill-${r.status}">${pillLabel}</span></td><td class="val-cell">${excelCell}</td><td class="val-cell">${jsonCell}</td></tr>`;
    }).join('');
    renderPagination();
  }

  function renderPagination(){
    const total=Math.ceil(filteredResults.length/PAGE_SIZE);
    if(total<=1){document.getElementById('pagination').innerHTML='';return;}
    let html='';
    if(currentPage>1)html+=`<button class="page-btn" onclick="goPage(${currentPage-1})">‹ Prev</button>`;
    const start=Math.max(1,currentPage-2),end=Math.min(total,currentPage+2);
    for(let p=start;p<=end;p++)html+=`<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
    if(currentPage<total)html+=`<button class="page-btn" onclick="goPage(${currentPage+1})">Next ›</button>`;
    html+=`<span class="page-info">${filteredResults.length} results</span>`;
    document.getElementById('pagination').innerHTML=html;
  }

  function goPage(p){currentPage=p;renderTable();window.scrollTo(0,document.getElementById('resultsSection').offsetTop);}

  function exportCSV(){
    const rows=[['Key Path','Status','Excel Value','JSON Value']];
    filteredResults.forEach(r=>rows.push([r.key,r.status,r.excelVal??'',r.jsonVal??'']));
    const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='json_diff_results.csv';
    a.click();
  }

  function esc(str){if(str===null||str===undefined)return '—';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function showError(msg){const el=document.getElementById('errorMsg');el.textContent='⚠ '+msg;el.style.display='block';}
  function clearError(){document.getElementById('errorMsg').style.display='none';}
  function checkReady(){const keyCol=document.getElementById('colKey').value;document.getElementById('compareBtn').disabled=!(excelData.length>0&&jsonData&&typeof jsonData==='object'&&keyCol!=='');}
</script>
</body>
</html>
